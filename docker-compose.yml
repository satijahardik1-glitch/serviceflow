# Production-style stack: PostgreSQL + the ServiceFlow app (API + frontend) on :8000
#   cp .env.production.example .env   # fill in the secrets
#   docker compose up -d --build
#   docker compose exec app python create_admin.py --email you@company.com
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: serviceflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceflow -d serviceflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://serviceflow:${POSTGRES_PASSWORD}@db:5432/serviceflow
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"

volumes:
  pgdata:
